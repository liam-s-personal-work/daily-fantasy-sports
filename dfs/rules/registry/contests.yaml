# Keyed "<site>.<sport>.<game_type>". Slot labels here are canonical; when an entries
# file is supplied its own header labels and order win (and differences are reported).
# confidence: high = confirmed on real 2026 site files; medium = secondary sources /
# captured DK rule objects; low = old open-source encodings. Re-verify against the
# contest's own rules page whenever confidence is not high (`dfs rules show <key>`).
# Research notes and sources: docs/research/site_formats.md
