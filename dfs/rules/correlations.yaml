# Gaussian-copula correlations of fantasy-point *surprises* (residuals around each
# player's projection), by relation and position pair. Projections already carry the
# shared game environment through team totals, so these sit below published raw
# fantasy-point correlations (QB-WR1 raw ~0.37-0.54, DST vs opposing offense ~-0.78
# at the team-points level). `dfs fit-correlations` re-estimates the NFL block from
# nflverse residuals and writes nfl_fitted; the simulator prefers fitted values.
nfl:
  same_team:
    QB-WR: 0.40
    QB-TE: 0.30
    QB-RB: 0.10
    WR-WR: 0.05
    WR-TE: 0.00
    TE-TE: -0.05
    RB-WR: -0.02
    RB-TE: -0.02
    RB-RB: -0.20
    RB-DST: 0.15
    QB-DST: -0.05
    WR-DST: -0.08
    TE-DST: -0.05
    QB-K: 0.15
    RB-K: 0.10
    WR-K: 0.05
    TE-K: 0.05
    K-DST: 0.10
    default: 0.0
  opponent:
    QB-QB: 0.20
    QB-WR: 0.20
    QB-TE: 0.12
    QB-RB: 0.05
    WR-WR: 0.12
    WR-TE: 0.08
    RB-WR: 0.03
    RB-RB: -0.05
    DST-QB: -0.35
    DST-WR: -0.22
    DST-TE: -0.18
    DST-RB: -0.18
    DST-K: -0.20
    DST-DST: -0.10
    default: 0.03
cfb:
  same_team:
    QB-WR: 0.40
    QB-RB: 0.10
    WR-WR: 0.05
    RB-RB: -0.20
    default: 0.0
  opponent:
    QB-QB: 0.20
    QB-WR: 0.20
    WR-WR: 0.12
    default: 0.03
nba:
  same_team:
    default: -0.05   # shared possessions: teammates' usage competes
  opponent:
    default: 0.08    # pace / overtime lift both sides
